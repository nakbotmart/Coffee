<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อ — Fresh Craft Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Fresh Craft Coffee</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้าทั้งหมด</a></li>
      </ul>
    </div>
  </header>

  <section class="section">
    <div class="container container-narrow">
      <h1 class="page-title">ยืนยันคำสั่งซื้อ</h1>
      <p class="page-subtitle">กรอกข้อมูลให้ครบถ้วน เราจะติดต่อกลับเพื่อยืนยันการชำระเงิน</p>

      <form id="orderForm" class="order-form">
        <div class="form-group">
          <label for="customerName">ชื่อผู้สั่งซื้อ</label>
          <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="contact">ช่องทางติดต่อ (เบอร์โทร / Line ID)</label>
          <input type="text" id="contact" name="contact" placeholder="08X-XXX-XXXX หรือ Line ID" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" placeholder="ชื่อสินค้า" required>
        </div>

        <div class="form-group">
          <label for="total">ยอดรวม (บาท)</label>
          <input type="number" id="total" name="total" placeholder="0" min="0" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุเพิ่มเติม</label>
          <textarea id="note" name="note" rows="3" placeholder="เช่น ความหวาน, เวลารับสินค้า (ถ้ามี)"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">ยืนยันคำสั่งซื้อ</button>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Fresh Craft Coffee. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
